# bowyer — TDS driver test environment
#
#   SQL Server 2022 (16.x)  ->  localhost:1433
#   SQL Server 2025 (17.x)  ->  localhost:1434
#
# Both run the free Developer edition (full-featured, non-expiring, non-prod).
#
#   docker compose up -d          # start both
#   docker compose ps             # watch health -> "healthy"
#   docker compose down           # stop (keeps data)
#   docker compose down -v        # stop and wipe the databases
#
# Connect from bowyer:  sa / <the password below>  on 127.0.0.1,1433 or ,1434

name: bowyer-testdb

x-mssql-env: &mssql-env
  ACCEPT_EULA: "Y"
  MSSQL_PID: "Developer"
  # Override via a .env file or your shell. Must satisfy SQL Server's policy:
  # >= 8 chars and 3 of {uppercase, lowercase, digit, symbol}.
  MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Bowyer_Dev2026!}"

# Health probe uses mssql-tools18 (bundled in current images). -C trusts the
# server's self-signed cert; $$ escapes the var so the container shell expands it.
x-mssql-healthcheck: &mssql-healthcheck
  test:
    - CMD-SHELL
    - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bowyer-sql2022
    hostname: sql2022
    ports:
      - "1433:1433"
    environment:
      <<: *mssql-env
    healthcheck:
      <<: *mssql-healthcheck
    volumes:
      - sql2022-data:/var/opt/mssql
    restart: unless-stopped

  sql2025:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bowyer-sql2025
    hostname: sql2025
    ports:
      - "1434:1433"
    environment:
      <<: *mssql-env
    healthcheck:
      <<: *mssql-healthcheck
    volumes:
      - sql2025-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql2022-data:
  sql2025-data:
